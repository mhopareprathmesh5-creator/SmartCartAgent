[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not live"
filterwarnings =
    ignore:.*uses fixed sampling defaults.*:UserWarning
markers =
    db: needs the seeded PostgreSQL database (docker compose up -d + scripts 02-03)
    live: calls the real Gemini API (costs quota) — run with: python -m pytest -m live
